services:
  foodwaste-predictor:
    build:
      context: .
      dockerfile: Dockerfile
    image: paionios/foodwaste-predictor:latest
    container_name: foodwaste-predictor-paionios
    ports:
      - "${GRADIO_SERVER_PORT:-7860}:7860"
    # `required: false` memastikan `docker-compose up --build` TETAP berjalan
    # walau file .env belum dibuat (mis. saat juri pertama kali mencoba tanpa
    # API key) — aplikasi akan otomatis masuk ke mode fallback heuristik.
    env_file:
      - path: .env
        required: false
    environment:
      GRADIO_SERVER_NAME: "0.0.0.0"
      GRADIO_SERVER_PORT: "7860"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:7860', timeout=4)"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
